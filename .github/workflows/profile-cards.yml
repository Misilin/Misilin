name: Refresh profile cards

on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * *'

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out current main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Refresh the existing 3D surface
        id: surface
        continue-on-error: true
        uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: Misilin

      - name: Generate the 31-day activity chart
        id: activity
        continue-on-error: true
        env:
          PROFILE_USERNAME: Misilin
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generate-activity.mjs

      - name: Generate profile trophies
        id: trophies
        continue-on-error: true
        uses: ryo-ma/github-profile-trophy@e3c89df995e92e67cdd4b2acaab9d974583dc1f7
        with:
          username: Misilin
          output_path: assets/trophies.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          theme: tokyonight

      - name: Commit generated images
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for card in assets/activity.svg assets/trophies.svg; do
            if [ -s "$card" ]; then
              git add -- "$card"
            fi
          done

          if [ -d profile-3d-contrib ]; then
            git add -- profile-3d-contrib
          fi

          if ! git diff --cached --quiet; then
            git commit -m 'Refresh profile contribution images and trophies'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Report generation failures
        if: always() && (steps.surface.outcome == 'failure' || steps.activity.outcome == 'failure' || steps.trophies.outcome == 'failure')
        run: |
          echo 'An image failed to refresh. Inspect the failed generation step above.'
          exit 1
